<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/brand/patwiki-logo-monochrome.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="/brand/patwiki.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PatWiki</title>
    <style>
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      .bootstrap-loading { position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center; justify-items: center; gap: 10px; background: #f8fafc; color: #0f172a; font: 14px system-ui, sans-serif; }
      .bootstrap-loading-mark { display: block; width: 64px; height: 64px; animation: bootstrap-pulse 1.5s ease-in-out infinite; }
      .bootstrap-loading-label { color: #64748b; font-size: 12px; }
      .bootstrap-loading-track { width: 160px; height: 3px; overflow: hidden; border-radius: 99px; background: #dbe5e8; }
      .bootstrap-loading-track::after { display: block; width: 45%; height: 100%; border-radius: inherit; background: #0f766e; content: ""; animation: bootstrap-progress 1.2s ease-in-out infinite; }
      @keyframes bootstrap-pulse { 50% { transform: scale(1.04); } }
      @keyframes bootstrap-progress { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .bootstrap-loading-mark, .bootstrap-loading-track::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootstrap-loading" role="status" aria-live="polite">
        <img class="bootstrap-loading-mark" src="/patwiki-logo.svg" width="64" height="64" alt="" />
        <strong>正在启动 PatWiki</strong>
        <span class="bootstrap-loading-label">正在连接本地工作区</span>
        <div class="bootstrap-loading-track"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
